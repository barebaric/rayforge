[workspace]
name = "rayforge"
version = "0.1.0"
channels = ["conda-forge", "bioconda", "msys2", "coastline"]
platforms = ["linux-64", "osx-arm64"]

[environments]
default = { features = ["app", "test"], solve-group = "default" }
website = { features = ["website"], solve-group = "default" }
build = { features = ["build-tools"], solve-group = "build" }
video = { features = ["video-tools"], solve-group = "video" }

[feature.app.dependencies]
adwaita-icon-theme = "==49.0"
glib = "==2.88.3"
cairo = "==1.18.4"
expat = "==2.8.1"
gettext = "==0.25.1"
gobject-introspection = "==1.86.0"
gtk4 = "==4.22.4"
libheif = "==1.23.1"
libvips = "==8.18.5"
openslide = "==4.0.1"
poppler = "==26.7.0"
python = "==3.14.6"
librsvg = "==2.62.3"
svgelements = "==1.9.6"
pluggy = "==1.6.0"
scipy = "==1.18.0"
numpy = "==2.5.2"
pycairo = "==1.29.1"
PyOpenGL = "==3.1.10"
PyOpenGL-accelerate = "==3.1.10"
PyGObject = "==3.56.3"
pkg-config = "==0.29.2"
rust = "==1.97.1"
patchelf = "==0.19.1"

[feature.app.pypi-dependencies]
raygeo = "==1.47.0"
rayforge = { editable = true, path = "." }
aiohttp = "==3.14.3"
asyncudp = "==0.11.0"
blinker = "==1.9.0"
build = "==1.5.0"
cairosvg = "==2.9.0"
ezdxf = "==1.4.4"
GitPython = "==3.1.59"
platformdirs = "==4.11.3"
pypdf = "==6.16.2"
pymupdf = "==1.28.2"
pyserial = "==3.5"
pyvips = "==3.1.1"
PyYAML = "==6.0.3"
semver = "==3.0.4"
trimesh = "==5.0.0"
vtracer = "==0.6.15"
websockets = "==17.0.1"
zeroconf = "==0.150.0"

[feature.app.target.linux-64.dependencies]
xorg-xproto = "==7.0.31"
xorg-libx11 = "==1.8.13"
xorg-kbproto = "==1.0.7"
xorg-xextproto = "==7.3.0"
xorg-xineramaproto = "==1.2.1"
xorg-xf86vidmodeproto = "==2.3.1"
xorg-renderproto = "==0.11.1"
xorg-inputproto = "==2.3.2"
xorg-compositeproto = "==0.4.2"
xorg-damageproto = "==1.2.1"
xorg-glproto = "==1.4.17"
xorg-presentproto = "==1.1"
xorg-libxext = "==1.3.7"
xorg-libxinerama = "==1.1.6"
xorg-libxrandr = "==1.5.5"

[feature.build-tools.dependencies]
gettext = "==0.25.1"

[feature.test.dependencies]
pytest = "==9.1.1"
appstream = "==1.1.1"

[feature.test.pypi-dependencies]
pytest-asyncio = "==1.4.0"
pytest-mock = "==3.15.1"
pytest-cov = "==7.1.0"
pygobject-stubs = "==2.17.0"
flake8 = "==7.3.0"
pyflakes = "==3.4.0"
pyright = "==1.1.411"
ruff = "==0.16.4"
pre-commit = "==4.6.2"

[feature.website.dependencies]
nodejs = "==26.6.0"
[feature.video-tools.dependencies]
ffmpeg = "==9.0.1"
python = "==3.14.7"

[feature.video-tools.pypi-dependencies]
pillow = "==12.3.0"

[tool.pixi]
workdir = "."

[tasks]
pre-commit-install = "pre-commit install"
lint = { depends-on = ["ruff", "flake", "pyflakes", "pyright", "validate-metainfo"] }
update-translations = "bash scripts/update_translations.sh"
compile-translations = "bash scripts/update_translations.sh --compile-only"
print-untranslated = "bash scripts/print_untranslated.sh"
update-supporters = "python3 scripts/media/update_supporters.py"
fetch-stats = "python3 scripts/fetch_download_stats.py"
normalize-icons = "python3 scripts/normalize_icons.py"
gen-affiliate = "python3 scripts/generate_affiliate_link.py"
optimize-textures = "python3 scripts/optimize_material_textures.py"
optimize-images = "python3 scripts/optimize_images.py"
create-icon = "python3 scripts/create_icon.py"

[tasks.clean]
cmd = "bash scripts/clean.sh"

[tasks.format]
cmd = "ruff format rayforge tests scripts && ruff check --select I --fix rayforge tests scripts"

[tasks.flake]
depends-on = ["format"]
cmd = "flake8 --ignore=E127,E128,E121,E123,E126,E203,E226,E24,E704,W503,W504 --builtins=_ rayforge tests"

[tasks.ruff]
depends-on = ["format"]
cmd = "ruff check rayforge tests scripts"

[tasks.pyflakes]
depends-on = ["format"]
env = { PYFLAKES_BUILTINS = "_" }
cmd = "pyflakes rayforge tests"

[tasks.pyright]
depends-on = ["format"]
env = { VIRTUAL_ENV = ".pixi/envs/default" }
cmd = "pyright"

[tasks.validate-metainfo]
cmd = "appstreamcli validate --no-net data/org.rayforge.rayforge.metainfo.xml"

[tasks.rayforge]
env = { GI_TYPELIB_PATH = "$(pkgconf --variable=typelibdir gobject-introspection-1.0)"}
cmd = "scripts/with_gdk.sh python -m rayforge"

[tasks.testapp]
env = { GI_TYPELIB_PATH = "$(pkgconf --variable=typelibdir gobject-introspection-1.0):/usr/lib/x86_64-linux-gnu/girepository-1.0"}
cmd = "scripts/with_gdk.sh"

[tasks.test]
env = { GI_TYPELIB_PATH = "$(pkgconf --variable=typelibdir gobject-introspection-1.0)"}
cmd = "pytest -v --ignore=tests/ui_gtk"

[tasks.uitest]
env = { GI_TYPELIB_PATH = "$(pkgconf --variable=typelibdir gobject-introspection-1.0):/usr/lib/x86_64-linux-gnu/girepository-1.0"}
cmd = "pytest -v -m ui"

[tasks.screenshot]
env = { GI_TYPELIB_PATH = "$(pkgconf --variable=typelibdir gobject-introspection-1.0)"}
cmd = "scripts/with_gdk.sh scripts/screenshot/cli.py"

[tasks.wheel]
cmd = "python3 -m build"
depends-on = ["compile-translations"]

[tasks.build-deb]
# Builds a binary .deb package for local installation and testing.
cmd = "bash scripts/build-deb.sh"
depends-on = ["compile-translations"]

[tasks.build-deb-source]
# Builds a source package, ready for upload to a PPA.
cmd = "bash scripts/build-deb.sh --source"
depends-on = ["compile-translations"]

[dependencies]
libadwaita = "==1.9.3"

# Keep the conda solve from backtracking pygobject below the
# pygobject>=3.55.0 floor required by the pygobject-stubs pypi
# dependency ("pixi upgrade" otherwise becomes unsatisfiable).
[constraints]
pygobject = ">=3.55.0"

[target.linux-64.dependencies]
libglvnd = "==1.7.0"

# Tasks for developing and generating the website
[feature.website.tasks]
site-gen-api = "python3 scripts/update_api_docs.py"
site-install = { cmd = "npm install", cwd = "website" }
site-serve = { cmd = "npm start", cwd = "website", depends-on = ["update-api-docs"] }
site-build = { cmd = "npm run build", cwd = "website", depends-on = ["site-gen-api"] }
site-deploy = { cmd = "bash scripts/deploy_website.sh", depends-on = ["site-gen-api"] }

[tasks.update-api-docs]
cmd = "python3 scripts/update_api_docs.py"

# Tasks for video processing
[feature.video-tools.tasks]
process-audio = "python3 scripts/media/process_audio.py"
generate-blender-setup = "bash scripts/media/run_blender_setup.sh"
generate-thumbnail = "python3 scripts/media/generate_thumbnail.py"
