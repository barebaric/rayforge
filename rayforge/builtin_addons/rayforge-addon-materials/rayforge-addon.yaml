name: core_materials
display_name: "Core Materials"
description: "Built-in material library with common laser cutting materials"
long_description: |
  A built-in library of common laser cutting materials, from plywood
  and acrylic to aluminum and marble.

  - Each material carries appearance and preset settings
  - Apply material presets to your operations instead of tuning
    parameters by hand
  - Extend the library with your own materials or material addons
