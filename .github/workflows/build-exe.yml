name: Build Windows Executable

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      msix_version: ${{ steps.set-version.outputs.msix_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set Version
        id: set-version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${{ github.ref_name }}
          elif git describe --tags >/dev/null 2>&1; then
            VERSION=$(git describe --tags)
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          if [ -z "$VERSION" ]; then
            echo "Error: No git version number found!"
            exit 1
          fi
          if [[ "$VERSION" == *-* || "$VERSION" == *~* ]]; then
            MSIX_VERSION="1.0.0.$(( GITHUB_RUN_NUMBER % 60000 + 1 ))"
          else
            MSIX_VERSION="$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "msix_version=$MSIX_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          echo "MSIX version: $MSIX_VERSION"

  build:
    runs-on: windows-2025
    needs: version
    outputs:
      msix_identity_name: ${{ steps.msix.outputs.identity_name }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MSIX_VERSION: ${{ needs.version.outputs.msix_version }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Rayforge.Dev' }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Rayforge Dev' }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Rayforge' }}
      MSIX_CERT_PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
      MSIX_CERT_PASSWORD: ${{ secrets.MSIX_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Cache pip and cargo
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache
          key: win-deps-${{ hashFiles('requirements.txt') }}-${{ hashFiles('scripts/win/win_setup.sh') }}
          restore-keys: win-deps-

      - name: Set up MSYS2 Environment Shell
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          #update: true
          # Minimal packages required to run the setup script itself
          install: base-devel git unzip wget zip

      - name: Configure Environment Paths
        shell: msys2 {0}
        run: |
          # Use cygpath to reliably convert the runner's Windows path to an MSYS2 path.
          # This is the standard and most robust method.
          MSYS2_PATH_VAR=$(cygpath -u "${{ steps.msys2.outputs.msys2-location }}")

          echo "MSYS2_PATH=$MSYS2_PATH_VAR" >> $GITHUB_ENV

          # Add necessary binaries to the system PATH for subsequent steps
          echo "$MSYS2_PATH_VAR/ucrt64/bin" >> $GITHUB_PATH
          echo "$MSYS2_PATH_VAR/usr/bin" >> $GITHUB_PATH

      - name: Install Dependencies (win_setup.sh)
        shell: msys2 {0}
        run: |
          # The MSYS2_PATH is required by the setup script to generate the .msys2_env file.
          export MSYS2_PATH=${{ env.MSYS2_PATH }}
          bash scripts/win/win_setup.sh

      - name: Verify GI Typelib Files
        shell: msys2 {0}
        if: false
        run: |
          source $GITHUB_WORKSPACE/.msys2_env
          echo "Listing GI typelib files:"
          ls -l $GI_TYPELIB_PATH/*.typelib

      - name: List MSYS2 packages
        shell: msys2 {0}
        if: false
        run: |
          source $GITHUB_WORKSPACE/.msys2_env
          pacman --version
          pacman -Q

      - name: Check Cairo DLL Dependencies
        shell: msys2 {0}
        if: false
        run: |
          source $GITHUB_WORKSPACE/.msys2_env
          $MSYS2_PATH/ucrt64/bin/ntldd -R $MSYS2_PATH/ucrt64/bin/libcairo-2.dll
          $MSYS2_PATH/ucrt64/bin/ntldd -R $MSYS2_PATH/ucrt64/bin/libcairo-gobject-2.dll
          $MSYS2_PATH/ucrt64/bin/objdump -p $MSYS2_PATH/ucrt64/bin/libcairo-2.dll | grep "DLL Name"
          $MSYS2_PATH/ucrt64/bin/objdump -p $MSYS2_PATH/ucrt64/bin/libcairo-gobject-2.dll | grep "DLL Name"

      - name: Prepare MSIX Signing Certificate
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "rayforge-msix.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "rayforge-msix.cer"
          if ($env:MSIX_CERT_PFX_BASE64) {
              if (-not $env:MSIX_CERT_PASSWORD) {
                  throw "MSIX_CERT_PASSWORD is required with MSIX_CERT_PFX_BASE64."
              }
              [IO.File]::WriteAllBytes(
                  $pfxPath,
                  [Convert]::FromBase64String($env:MSIX_CERT_PFX_BASE64)
              )
              $password = ConvertTo-SecureString `
                  -String $env:MSIX_CERT_PASSWORD `
                  -Force -AsPlainText
              $cert = Import-PfxCertificate `
                  -FilePath $pfxPath `
                  -CertStoreLocation Cert:\CurrentUser\My `
                  -Password $password
          } else {
              $cert = New-SelfSignedCertificate `
                  -Type CodeSigningCert `
                  -Subject $env:MSIX_PUBLISHER `
                  -CertStoreLocation Cert:\CurrentUser\My `
                  -KeyUsage DigitalSignature `
                  -NotAfter (Get-Date).AddDays(30)
              $password = [guid]::NewGuid().ToString("N")
              $securePassword = ConvertTo-SecureString `
                  -String $password -Force -AsPlainText
              Export-PfxCertificate `
                  -Cert $cert `
                  -FilePath $pfxPath `
                  -Password $securePassword | Out-Null
              "MSIX_CERT_PASSWORD=$password" >> $env:GITHUB_ENV
          }
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          New-Item -ItemType Directory -Force `
              "$env:GITHUB_WORKSPACE\dist\msix" | Out-Null
          Copy-Item $cerPath "$env:GITHUB_WORKSPACE\dist\msix\test-cert.cer"
          "MSIX_CERT_PFX=$pfxPath" >> $env:GITHUB_ENV

      - name: Run Test Suite (win_test.sh)
        shell: msys2 {0}
        run: |
          # Enable debug logging for Python
          export PYTHONUNBUFFERED=1
          export PYTHONFAULTHANDLER=1
          # Enable RUST backtrace for vtracer
          export RUST_BACKTRACE=1
          # The test script will source .msys2_env internally.
          bash scripts/win/win_test.sh

      - name: Run Build Process (win_build.sh)
        shell: msys2 {0}
        run: |
          # The build script will source .msys2_env internally.
          bash scripts/win/win_build.sh "${{ env.VERSION }}"

      - name: Build MSIX Package
        shell: msys2 {0}
        env:
          MSIX_TIMESTAMP_URL: http://timestamp.digicert.com
        run: |
          # The build script will source .msys2_env internally.
          bash scripts/win/win_msix.sh "${{ env.VERSION }}"

      - name: Record MSIX Identity
        id: msix
        shell: bash
        run: echo "identity_name=$MSIX_IDENTITY_NAME" >> "$GITHUB_OUTPUT"

      - name: Compress PyInstaller Bundle
        shell: msys2 {0}
        run: |
          BUNDLE_DIR="dist/rayforge-v${{ env.VERSION }}"
          ZIP_FILE="dist/rayforge-v${{ env.VERSION }}-windows-bundle.zip"
          zip -r -1 "${ZIP_FILE}" "${BUNDLE_DIR}"

      - name: Upload PyInstaller bundle
        uses: actions/upload-artifact@v7
        with:
          name: rayforge-v${{ needs.version.outputs.version }}-windows-bundle
          path: dist/rayforge-v${{ needs.version.outputs.version }}-windows-bundle.zip

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rayforge-v${{ needs.version.outputs.version }}-installer.zip
          path: dist/rayforge-v${{ needs.version.outputs.version }}-installer.exe
          compression-level: 0

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rayforge-v${{ needs.version.outputs.version }}-msix
          path: |
            dist/rayforge-v${{ needs.version.outputs.version }}-x64.msix
            dist/msix/test-cert.cer
          compression-level: 0

  test-msix:
    name: Test MSIX Package
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download MSIX Artifact
        uses: actions/download-artifact@v8
        with:
          name: rayforge-v${{ needs.version.outputs.version }}-msix

      - name: Install and Launch MSIX
        shell: pwsh
        run: |
          $cert = Get-ChildItem -Recurse -Filter "test-cert.cer" |
              Select-Object -First 1
          if (-not $cert) {
              throw "MSIX test certificate not found."
          }
          Import-Certificate `
              -FilePath $cert.FullName `
              -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null

          $package = Get-ChildItem -Recurse -Filter "*.msix" |
              Select-Object -First 1
          if (-not $package) {
              throw "MSIX package not found."
          }
          Add-AppxPackage -Path $package.FullName

          $app = Get-AppxPackage `
              -Name "${{ needs.build.outputs.msix_identity_name }}"
          if (-not $app) {
              throw "Rayforge package was not registered."
          }

          $alias = Join-Path $env:LOCALAPPDATA `
              "Microsoft\WindowsApps\rayforge.exe"
          if (-not (Test-Path $alias)) {
              throw "The rayforge.exe execution alias is missing."
          }
          & $alias --version
          if ($LASTEXITCODE -ne 0) {
              throw "rayforge.exe --version failed."
          }

          Start-Process $alias
          Start-Sleep -Seconds 15
          $process = Get-Process |
              Where-Object {
                  $_.Path -like "$($app.InstallLocation)\*"
              }
          if (-not $process) {
              throw "Rayforge did not start from the MSIX package."
          }
          $process | Stop-Process -Force

          Remove-AppxPackage -Package $app.PackageFullName

  test-exe:
    name: Test Executable
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: rayforge-v${{ needs.version.outputs.version }}-windows-bundle

      - name: Extract Bundle
        shell: bash
        run: |
          unzip rayforge-v${{ needs.version.outputs.version }}-windows-bundle.zip

      - name: Test Executable (CLI)
        shell: bash
        run: |
          echo "Listing files in current directory:"
          ls -l

          # Define paths based on the extracted directory
          BUNDLE_DIR="dist/rayforge-v${{ needs.version.outputs.version }}"
          EXECUTABLE_NAME="rayforge-v${{ needs.version.outputs.version }}.exe"

          echo "Listing files in extracted directory:"
          ls -lR "${BUNDLE_DIR}"

          echo "Running executable directly:"
          ./"${BUNDLE_DIR}/${EXECUTABLE_NAME}" --help

      - name: Test Executable (UI Smoke Test)
        shell: bash
        run: |
          bash scripts/win/win_run_ui_test.sh \
            "dist/rayforge-v${{ needs.version.outputs.version }}" \
            "rayforge-v${{ needs.version.outputs.version }}.exe"

  release:
    name: Create GitHub Release
    # Keep the MSIX test out of the release gate while the NSIS installer
    # remains the primary Windows download. Add test-msix here when the
    # MSIX becomes a public release asset.
    needs: [version, build, test-exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'barebaric/rayforge'
    env:
      MSIX_CERT_PFX_BASE64: ${{ secrets.MSIX_CERT_PFX_BASE64 }}
    outputs:
      is_prerelease: ${{ steps.release_info.outputs.is_prerelease }}
    steps:
      - name: Determine release type
        id: release_info
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Installer Artifact
        uses: actions/download-artifact@v8
        with:
          # For the release, we use the installer artifact
          name: rayforge-v${{ needs.version.outputs.version }}-installer.zip

      - name: Download MSIX Artifact
        if: >-
          env.MSIX_CERT_PFX_BASE64 != '' &&
          !contains(github.ref_name, '-') &&
          !contains(github.ref_name, '~')
        uses: actions/download-artifact@v8
        with:
          name: rayforge-v${{ needs.version.outputs.version }}-msix

      - name: Determine Release Files
        id: release_files
        shell: bash
        run: |
          FILES="rayforge-v${{ needs.version.outputs.version }}-installer.exe"
          MSIX="rayforge-v${{ needs.version.outputs.version }}-x64.msix"
          if [ -f "$MSIX" ]; then
            FILES="$FILES"$'\n'"$MSIX"
          fi
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.release_files.outputs.files }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease }}
          name: Release ${{ needs.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  winget:
    name: Submit WinGet Manifest
    needs: release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'barebaric/rayforge'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download Installer
        shell: bash
        run: |
          curl -fSL -o installer.exe \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/rayforge-v${{ github.ref_name }}-installer.exe"

      - name: Compute Installer Hash
        id: installer
        shell: bash
        run: |
          HASH=$(sha256sum installer.exe | awk '{print toupper($1)}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"

      - name: Render Manifests
        shell: bash
        run: |
          bash scripts/win/winget/render_manifests.sh \
            "${{ github.ref_name }}" \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/rayforge-v${{ github.ref_name }}-installer.exe" \
            "${{ steps.installer.outputs.sha256 }}" \
            winget-manifests

      - name: Validate Manifests
        shell: pwsh
        run: |
          # winget exits nonzero on warnings; some winget builds falsely warn
          # about the schema header URL, and the winget-pkgs pipeline performs
          # the authoritative validation anyway.
          winget validate --manifest "$env:GITHUB_WORKSPACE\winget-manifests" --ignore-warnings

      - name: Determine PR Title
        id: prtitle
        shell: bash
        run: |
          # New packages must use the "New package:" title prefix; version
          # updates must not.
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/r/Rayforge/Rayforge")
          if [ "$CODE" = "200" ]; then
            echo "title=Rayforge.Rayforge version ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "title=New package: Rayforge.Rayforge version ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # "wingetcreate submit" gives up when the winget-pkgs fork of the
      # WINGET_PAT account can not be synced via the merge-upstream API,
      # which fails for forks that are too far behind upstream.
      - name: Sync winget-pkgs fork
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_PAT }}
        run: bash scripts/win/winget/sync_fork.sh

      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"
          .\wingetcreate.exe submit "$env:GITHUB_WORKSPACE\winget-manifests" --prtitle "${{ steps.prtitle.outputs.title }}" --no-open
