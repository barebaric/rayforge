api_version: 1
device:
  name: Sculpfun S9
  description: 5.5W diode laser engraver with 410x420mm work area
machine:
  driver: GrblSerialDriver
  gcode_precision: 3
  axis_extents:
  - 410.0
  - 420.0
  origin: bottom_left
  max_travel_speed: 3000
  max_cut_speed: 1000
  has_z: false
  heads:
  - max_power: 1000
    wavelength_nm: 455
    max_power_watts: 5.5
    frame_power_percent: 1.0
    focus_power_percent: 1.0
    spot_size_mm:
    - 0.06
    - 0.08
