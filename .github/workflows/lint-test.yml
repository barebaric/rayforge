name: Lint and Test
on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - "**"
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.68.1
          frozen: true
          cache: true
          cache-key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - name: Compile Translations
        run: pixi run --frozen compile-translations

      - name: Run flake8 Lint
        run: pixi run --frozen lint

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.68.1
          frozen: true
          cache: true
          cache-key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - name: Compile Translations
        run: pixi run --frozen compile-translations

      - name: Run backend tests
        run: pixi run --frozen test -m "not ui and not stress" --log-cli-level=DEBUG

  test-stress:
    name: Stress Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.68.1
          frozen: true
          cache: true
          cache-key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - name: Compile Translations
        run: pixi run --frozen compile-translations

      - name: Run stress tests
        run: pixi run --frozen test -m stress -n 0 --log-cli-level=DEBUG

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.68.1
          frozen: true
          cache: true
          cache-key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - name: Install Xvfb
        run: |
          if command -v xvfb-run >/dev/null 2>&1; then
            echo "Xvfb is already installed."
            exit 0
          fi
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 xvfb

      - name: Compile Translations
        run: pixi run --frozen compile-translations

      - name: Run UI tests
        run: pixi run --frozen uitest --log-cli-level=DEBUG
