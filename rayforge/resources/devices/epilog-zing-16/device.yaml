api_version: 1
device:
  name: Epilog Zing 16
  vendor: Epilog
  model: Zing 16
  description: Epilog Zing 16 (16 x 12 in) with Ethernet job upload
  notes: |-
    The machine's speed control is a percentage of its own reference
    speed, set as "100 % Speed" in the driver options (6000 mm/min
    here, so 600 mm/min is 10 %). This should be calibrated to your
    machine.

    Jobs are started at the laser's control panel; focus and air assist
    are manual, and the machine cannot be homed, jogged or queried
    remotely.

    Upload a job with Send and start it from the laser's job list.
    Frame uploads a beam-off outline job you can start the same way.
    The print queue is empty by default; set a name only if your print
    server requires one.
machine:
  driver: EpilogZingDriver
  axis_extents:
  - 406.0
  - 305.0
  origin: top_left
  has_z: false
  home_on_start: false
  max_cut_speed: 6000
  max_travel_speed: 6000
  capabilities:
  - LASER
  driver_args:
    host: ''
    port: 515
    queue: ''
    speed_reference: 6000
    resolution: '500'
    frequency: 1000
  heads:
  - name: Laser
    max_power: 100
    wavelength_nm: 10600
    laser_type: co2
    frame_power_percent: 0.0
    focus_power_percent: 0.0
    spot_size_mm:
    - 0.1
    - 0.1
