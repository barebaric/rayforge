api_version: 1
device:
  name: Sculpfun iCube 3W
  vendor: Sculpfun
  model: iCube
  description: Compact 3W diode laser engraver with 125x125mm work area
machine:
  driver: GrblSerialDriver
  driver_config:
    rx_buffer_size: 31
  gcode_precision: 3
  axis_extents:
  - 125.0
  - 125.0
  origin: bottom_left
  max_travel_speed: 3000
  max_cut_speed: 1000
  home_on_start: true
  has_z: false
  heads:
  - max_power: 1000
    wavelength_nm: 455
    max_power_watts: 3
    frame_power_percent: 1.0
    focus_power_percent: 1.0
    spot_size_mm:
    - 0.02
    - 0.02
