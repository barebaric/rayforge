name: Build and Publish Snap

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-test:
    if: github.repository == 'barebaric/rayforge'
    uses: ./.github/workflows/lint-test.yml

  build-publish-snap:
    name: Build and Publish Snap
    needs: [lint-test]  # Run only if tests pass
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.68.1
          frozen: true
          cache: true
          cache-key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          environments: build

      - name: Compile Translations
        run: pixi run --frozen -e build compile-translations

      - name: Cache snapcraft state
        uses: actions/cache@v4
        with:
          path: ~/.cache/snapcraft
          key: snapcraft-${{ runner.os }}-${{ hashFiles('snap/snapcraft.yaml') }}
          restore-keys: snapcraft-${{ runner.os }}-

      - name: Cache snapcraft snap
        uses: actions/cache@v4
        with:
          path: ~/snapcraft-cache
          key: snapcraft-snap-${{ runner.os }}-stable
          restore-keys: snapcraft-snap-${{ runner.os }}-

      - name: Install snapcraft
        run: |
          if command -v snapcraft >/dev/null 2>&1; then
            echo "Snapcraft is already installed."
            exit 0
          fi
          mkdir -p "$HOME/snapcraft-cache"
          if ! ls "$HOME/snapcraft-cache"/*.snap >/dev/null 2>&1; then
            rm -f "$HOME/snapcraft-cache"/*
            (cd "$HOME/snapcraft-cache" && \
              snap download snapcraft --channel=stable)
          fi
          SNAP_PATH=$(ls -t "$HOME/snapcraft-cache"/*.snap | sed -n '1p')
          sudo snap install "$SNAP_PATH" --classic --dangerous

      - name: Build snap
        id: build
        env:
          SNAPCRAFT_DEBUG: "1"
        continue-on-error: true
        run: |
          snapcraft --destructive-mode
          SNAP_FILE=$(find . -maxdepth 1 -name '*.snap' -print -quit)
          if [ -z "$SNAP_FILE" ]; then
            echo "No snap file produced"
            exit 1
          fi
          echo "snap=$SNAP_FILE" >> "$GITHUB_OUTPUT"

      - name: Capture snapcraft logs on failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "::group::Snapcraft log files"
          for log in /home/runner/.local/state/snapcraft/log/*.log; do
            if [ -f "$log" ]; then
              echo "=== $log ==="
              cat "$log"
            fi
          done
          echo "::endgroup::"
          echo "::group::LXD status"
          sudo lxc list --project snapcraft 2>&1 || true
          sudo lxc storage list 2>&1 || true
          echo "::endgroup::"
          echo "::group::System resources"
          free -h
          df -h
          echo "::endgroup::"

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Test built snap
        run: |
          sudo snap install ${{ steps.build.outputs.snap }} --dangerous
          rayforge --help

      - name: Determine release channel
        id: release_info
        if: |
          github.repository == 'barebaric/rayforge' &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "channel=beta,edge" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable,edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Snapcraft
        if: steps.release_info.outputs.channel != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.release_info.outputs.channel }}
