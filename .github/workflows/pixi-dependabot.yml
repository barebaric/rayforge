name: Update Pixi Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  pixi-upgrade:
    name: Update Pixi Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.76.2
          run-install: false

      - name: Upgrade dependencies
        run: |
          : > requirements.txt
          pixi clean cache -y
          # 'pixi upgrade' re-pins every package to the latest stable
          # release, which would downgrade any pre-release pin. Exclude
          # such packages there, then try to advance each one by
          # re-solving with a floor strictly above its pin; if no
          # newer version exists the solve fails and the pin is kept.
          # tighten_pins.py pins successfully advanced packages to the
          # solved version again.
          python3 scripts/prerelease_pins.py > prerelease.txt
          excludes=$(awk '{print "--exclude", $1}' prerelease.txt | tr '\n' ' ')
          pixi upgrade --pinning-strategy exact-version $excludes
          : > bumped.txt
          while read -r name version; do
            sed -i "s/^$name = \"==.*\"/$name = \">$version\"/" pixi.toml
            if pixi update < /dev/null; then
              echo "$name" >> bumped.txt
            else
              sed -i "s/^$name = \">.*\"/$name = \"==$version\"/" pixi.toml
            fi
          done < prerelease.txt
          python3 scripts/tighten_pins.py bumped.txt
          rm prerelease.txt bumped.txt
          git restore requirements.txt
          python3 scripts/sync_requirements.py
          pixi clean cache -y
          pixi update

      - name: Generate dependency diff
        run: |
          set -o pipefail
          git show HEAD:pixi.lock \
            | pixi exec pixi-diff --after pixi.lock --manifest-path pixi.toml \
            | pixi exec pixi-diff-to-markdown > diff.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          commit-message: "deps: update pixi dependencies"
          title: "deps: update pixi dependencies"
          body-path: diff.md
          branch: pixi-dependabot
          base: main
          delete-branch: true
          add-paths: |
            pixi.toml
            pixi.lock
            requirements.txt
            debian/requirements-bundle.txt
