name: sketcher
display_name: "Sketcher"
description: "Vector sketch editing functionality for creating and editing vector graphics"
long_description: |
  Draw and edit vector graphics directly on the canvas with a
  constraint-based sketcher.

  - **Drawing tools**: lines, arcs, ellipses, rectangles, polygons,
    and text
  - **Constraints**: lock geometry with dimensional and geometric
    constraints
  - **Editing**: chamfer, fillet, offset, and array tools
screenshots:
  - website/static/screenshots/addons-sketcher-editor.webp
  - website/static/screenshots/addons-sketcher-constraints.webp
api_version: 19
author:
  name: "Rayforge Team"
  email: "noreply@rayforge.org"
provides:
  worker: "sketcher.worker"
  frontend: "sketcher.frontend"
