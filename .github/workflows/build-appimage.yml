name: Build AppImage

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set Version
        id: set-version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${{ github.ref_name }}
          elif git describe --tags >/dev/null 2>&1; then
            VERSION=$(git describe --tags)
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          if [ -z "$VERSION" ]; then
            echo "Error: No git version number found!"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.68.1
          frozen: true
          cache: true
          cache-key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          environments: appimage

      - name: Build AppImage
        run: pixi run --frozen --environment appimage build-appimage

      - name: Install Xvfb and FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rayforge-v${{ steps.set-version.outputs.version }}-appimage
          path: dist/Rayforge-*.AppImage
          compression-level: 0
          if-no-files-found: error

      - name: Smoke Test AppImage
        run: |
          xvfb-run -a ./dist/Rayforge-*.AppImage --version
          xvfb-run -a ./dist/Rayforge-*.AppImage --exit

  release:
    name: Attach AppImage to GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'barebaric/rayforge'
    permissions:
      contents: write
    steps:
      - name: Determine release type
        id: release_info
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v8
        with:
          name: rayforge-v${{ needs.build.outputs.version }}-appimage

      - name: Attach AppImage to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: Rayforge-*.AppImage
          draft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
