laser_on: M4 S{power:.0f}
laser_off: M5
focus_laser_on: G1 F1 M3 S{power:.0f}
tool_change: ''
set_speed: ''
travel_move: G0{x_cmd}{y_cmd}{z_cmd}{extra_cmd}
linear_move: G1{x_cmd}{y_cmd}{z_cmd}{extra_cmd}{f_command}
arc_cw: G2{x_cmd}{y_cmd}{z_cmd}{extra_cmd} I{i} J{j}{f_command}
arc_ccw: G3{x_cmd}{y_cmd}{z_cmd}{extra_cmd} I{i} J{j}{f_command}
bezier_cubic: ''
air_assist_on: ''
air_assist_off: ''
home_all: M28
home_axis: ''
move_to: ''
move_to_park: ''
jog: ''
clear_alarm: ''
set_wcs_offset: ''
probe_cycle: ''
dwell: G4 P{seconds:.3f}
preamble:
- M17 S1 ;Enable steppers
- M207 S1 ;Program mode
- M106 S0 ;Cross-hair off
- M205 X430 Y390 ;Work area
- M101 ;Flat surface mode
- G21 ;Set units to mm
- G90 ;Absolute positioning
- M5
postscript:
- M5 ;Ensure laser is off
- G0 X0 Y0 ;Return to origin
- M18 ;Park the steppers
inject_wcs_after_preamble: false
can_g0_with_speed: false
omit_unchanged_coords: true
continuous_laser_mode: false
modal_feedrate: false
